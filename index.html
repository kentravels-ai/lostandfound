<!DOCTYPE html>
<!-- saved from url=(0037)https://thetins.com/lostandfound.html -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ken's Lost &amp; Found Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(10px, 3vw, 20px);
            line-height: 1.5;
            overflow-x: hidden;
        }
        
        .container {
            background: white;
            border-radius: clamp(15px, 5vw, 25px);
            padding: clamp(20px, 6vw, 30px) clamp(15px, 5vw, 25px);
            max-width: min(400px, 95vw);
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
            position: relative;
            overflow: hidden;
            margin: clamp(5px, 2vw, 10px);
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
        }
        
        .icon {
            font-size: clamp(3.5rem, 12vw, 5rem);
            margin-bottom: clamp(15px, 5vw, 25px);
            color: #667eea;
            line-height: 1;
        }
        
        h1 {
            color: #2c3e50;
            font-size: clamp(1.4rem, 6vw, 2rem);
            margin-bottom: clamp(15px, 5vw, 25px);
            font-weight: 700;
            line-height: 1.2;
            word-wrap: break-word;
            hyphens: auto;
        }
        
        .message {
            color: #555;
            font-size: clamp(1rem, 4vw, 1.2rem);
            line-height: 1.6;
            margin-bottom: clamp(20px, 6vw, 30px);
            font-weight: 400;
            word-wrap: break-word;
            hyphens: auto;
        }
        
        .email-section {
            background: #f8f9fa;
            border-radius: clamp(15px, 4vw, 20px);
            padding: clamp(15px, 5vw, 25px) clamp(12px, 4vw, 20px);
            margin: clamp(20px, 6vw, 30px) 0;
            border-left: clamp(4px, 1.5vw, 6px) solid #667eea;
        }
        
        .email-label {
            color: #2c3e50;
            font-weight: 600;
            font-size: clamp(0.95rem, 3.5vw, 1.1rem);
            margin-bottom: clamp(10px, 3vw, 15px);
        }
        
        .email-link {
            color: white;
            text-decoration: none;
            font-size: clamp(0.9rem, 3.5vw, 1.1rem);
            font-weight: 600;
            padding: clamp(14px, 4vw, 18px) clamp(20px, 6vw, 30px);
            background: #667eea;
            border-radius: 50px;
            display: inline-block;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
            transition: all 0.2s ease;
            min-height: clamp(48px, 12vw, 56px);
            min-width: clamp(160px, 40vw, 200px);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            touch-action: manipulation;
            word-wrap: break-word;
        }
        
        .email-link:hover,
        .email-link:focus {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
            background: #5a6fd8;
        }
        
        .email-link:active {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
        }
        
        .email-address {
            margin-top: clamp(15px, 4vw, 20px);
            padding-top: clamp(15px, 4vw, 20px);
            border-top: 2px solid #e9ecef;
        }
        
        .email-text-label {
            color: #6c757d;
            font-size: clamp(0.8rem, 3vw, 0.9rem);
            font-weight: 500;
            margin-bottom: clamp(6px, 2vw, 8px);
        }
        
        .email-text {
            color: #2c3e50;
            font-size: clamp(0.9rem, 3.5vw, 1.1rem);
            font-weight: 600;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            background: white;
            padding: clamp(8px, 3vw, 12px) clamp(10px, 3vw, 16px);
            border-radius: clamp(6px, 2vw, 10px);
            border: 2px solid #e9ecef;
            display: inline-block;
            letter-spacing: 0.5px;
            user-select: all;
            -webkit-user-select: all;
            word-break: break-all;
            max-width: 100%;
        }
        
        .thank-you {
            color: #2c3e50;
            font-size: clamp(1.1rem, 4vw, 1.3rem);
            font-weight: 600;
            margin-top: clamp(20px, 5vw, 25px);
            line-height: 1.4;
            word-wrap: break-word;
        }
        
        .heart {
            color: #ff6b6b;
            font-size: clamp(1.2rem, 4vw, 1.4rem);
            margin: 0 5px;
        }
        
        .instructions {
            background: #e8f4fd;
            border-radius: clamp(10px, 3vw, 15px);
            padding: clamp(15px, 4vw, 20px);
            margin: clamp(20px, 5vw, 25px) 0;
            border-left: clamp(3px, 1vw, 5px) solid #45b7d1;
        }
        
        .instructions-text {
            color: #2c3e50;
            font-size: clamp(0.9rem, 3.5vw, 1rem);
            font-weight: 500;
            line-height: 1.5;
            word-wrap: break-word;
        }
        
        /* Extreme small screens fallback */
        @media (max-width: 280px) {
            .container {
                padding: 15px 10px;
                margin: 5px;
            }
            
            .email-link {
                min-width: 140px;
                padding: 12px 15px;
            }
        }
        
        /* Very short screens (landscape) */
        @media (max-height: 400px) and (orientation: landscape) {
            body {
                padding: 5px;
                align-items: flex-start;
                padding-top: 10px;
            }
            
            .container {
                margin: 5px 0;
            }
        }
        
        /* Extra wide screens */
        @media (min-width: 600px) {
            body {
                padding: 20px;
            }
            
            .container {
                max-width: 450px;
            }
        }
        
        /* High DPI displays */
        @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
            .container {
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            }
        }
        
        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            }
            
            .container {
                background: #2c3e50;
                color: #ecf0f1;
            }
            
            h1, .email-label, .thank-you {
                color: #ecf0f1;
            }
            
            .message {
                color: #bdc3c7;
            }
            
            .email-section {
                background: #34495e;
                border-left-color: #3498db;
            }
            
            .instructions {
                background: #34495e;
                border-left-color: #3498db;
            }
            
            .instructions-text {
                color: #ecf0f1;
            }
            
            .email-address {
                border-top-color: #4a5568;
            }
            
            .email-text-label {
                color: #a0aec0;
            }
            
            .email-text {
                color: #ecf0f1;
                background: #4a5568;
                border-color: #5a67d8;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔍</div>
        <h1>Ken and Joanne's<br> Lost &amp; Found</h1>
        
        <div class="message">
            Thank you for scanning our tag! If you've found our lost item, we're not far away.
        </div>
        
        <div class="instructions">
            <div class="instructions-text">
                Tap the email button below to contact us directly
            </div>
        </div>
        
        <div class="email-section">
            <div class="email-label">Contact us:</div>
            <a href="mailto:kenneth.tin@gmail.com?subject=Found%20Item!&amp;body=Hi%20Ken,%0A%0AI%20found%20your%20lost%20item%20and%20would%20like%20to%20return%20it.%0A%0APlease%20let%20me%20know%20how%20we%20can%20arrange%20the%20return.%0A%0AThanks!" class="email-link">
                📧 Email Ken
            </a>
            
            <div class="email-address">
                <div class="email-text-label">Or email directly:</div>
                <div class="email-text">kenneth.tin@gmail.com</div>
            </div>
        </div>
        
        <div class="thank-you">
            Thank you so much! <span class="heart">❤️</span>
        </div>
    </div>

</body></html>
